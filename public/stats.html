<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Stats · Touchdown Auction</title>
<style>body{margin:0;background:#02060f;color:#fff;font:15px/1.5 Inter,Arial,sans-serif;padding:24px}h1{font-size:28px;margin:0 0 4px}p{color:#a9b6d3;margin:4px 0 18px}table{border-collapse:collapse;width:100%;max-width:640px}th,td{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.13);text-align:right}th:first-child,td:first-child{text-align:left}th{color:#a9b6d3;font-size:12px;letter-spacing:.08em;text-transform:uppercase}</style></head>
<body><h1>Touchdown Auction · números</h1><p id="n">Carregando…</p><table id="t"></table>
<script>fetch('/api/stats',{cache:'no-store'}).then(r=>r.json()).then(j=>{document.getElementById('n').textContent='Salas públicas abertas agora: '+j.openPublicRooms+' · dia = horário de Brasília';
document.getElementById('t').innerHTML='<tr><th>Dia</th><th>Salas</th><th>Entradas</th><th>Leilões</th><th>Jogadores nos leilões</th><th>Terminados</th></tr>'+j.days.map(d=>'<tr><td>'+d.day+'</td><td>'+d.rooms+'</td><td>'+d.joins+'</td><td>'+d.games+'</td><td>'+d.players+'</td><td>'+d.done+'</td></tr>').join('')}).catch(()=>{document.getElementById('n').textContent='Não deu pra carregar.'})</script></body></html>
